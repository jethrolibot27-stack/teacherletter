<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=Edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Happy World Teacher's Day!</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <button id="playButton">Play Audio</button>
  <div class="body">
    <div class="birthdayCard">
      <div class="cardFront"><h3 class="happy">Happy World Teacher's Day!</h3>
        <div class="image">
          <img src="Randy.jpg" alt="image">
        </div>
      </div>
      <div class="cardInside">
        <h3 class="back">HAPPY TEACHER'S DAY SIR RANDY D. BELLO</h3>
        <p contenteditable="true">Dear sir Randy,</p> 
        <p contenteditable="true">Salamat sa imo paggiya, pagbulig, kag pagpasensya sa amon. Padayuna ang pagpanudlo nga may gugma kag inspirasyon. Diyos magpakamaayo sa imo pirme!</p>
        <p contenteditable="true" class="name">Jethro Libot</p>
      </div>
    </div>
  </div>
  <audio id="audio" src="AKING_GURO,_MAHAL_KONG_GURO(128k).mp4"></audio>
  <script src="script.js"></script>
</body>
</html>
<script>

document.addEventListener("DOMContentLoaded", function() {
  const audio = document.getElementById("audio");
  const playButton = document.getElementById("playButton");
  
  playButton.addEventListener("click", function() {
    if (audio.paused) {
      audio.play();
      playButton.textContent = "Pause Audio";
    } else {
      audio.pause();
      playButton.textContent = "Play Audio";
    }
  });
});

</script>
